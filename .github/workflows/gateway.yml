# Gateway sign-in fork (local modification of PLANKA, see GATEWAY.md).
# Replaces the upstream workflows, which publish upstream's own images and run
# on upstream's self-hosted runners.
#
# Every push and pull request: run the gateway unit tests, build the image,
# then run the end-to-end check (gateway-e2e/run.sh), which upgrades a real
# upstream 2.1.1 database to this image and exercises gateway sign-in.
# Pushes to main (and manual runs on main) then publish to GHCR as
#   <upstream version>-gw.<run number>, sha-<commit> and latest. Deployments
# pin latest@sha256 so Renovate can move the digest.

name: Gateway build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Gateway unit tests
        run: |
          docker run --rm -v "$PWD/server:/app" -w /app node:24-alpine \
            sh -c 'npm ci --ignore-scripts --no-audit --no-fund >/dev/null && npx mocha test/utils/gateway-identity.test.js'

      - name: Build image
        # The OCI labels let deployments trace the image to its commit
        # (rch-server-image's check-image-provenance.sh reads them).
        run: |
          docker build -t kanban-gateway-signin:ci \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            .

      - name: End-to-end check
        run: bash gateway-e2e/run.sh kanban-gateway-signin:ci

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kanban-gateway-signin
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${version}-gw.${GITHUB_RUN_NUMBER}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for t in "$tag" "sha-${GITHUB_SHA::12}" latest; do
            docker tag kanban-gateway-signin:ci "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          echo "Published $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"
