# Gateway sign-in fork (local modification of PLANKA, see GATEWAY.md).
#
# Weekly: merge the newest upstream PLANKA release into upstream/vX.Y.Z and
# open a pull request for the owner to review (.github/scripts/upstream-sync.sh).
# A conflicting merge, or a release left off main for 7 days, opens an issue.
# Nothing merges automatically.

name: Upstream sync

on:
  schedule:
    # Sundays 21:17 UTC, Monday morning in Melbourne.
    - cron: '17 21 * * 0'
  workflow_dispatch:

# This repository only: push the branch, open the pull request and issues,
# and start the Gateway build on the branch.
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the newest upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/upstream-sync.sh
